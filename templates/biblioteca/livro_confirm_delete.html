{% extends "base.html" %}

{% block title %}Excluir livro{% endblock %}

{% block content %}
<div class="confirm-box">
    <h1>Excluir livro</h1>
    <p>Tem certeza de que deseja excluir <strong>{{ livro.titulo }}</strong>?</p>
    <p>Esta ação não poderá ser desfeita.</p>
    <form method="post" class="actions-bar">
        {% csrf_token %}
        <button class="danger" type="submit">Sim, excluir</button>
        <a class="button secondary" href="{% url 'biblioteca:livro_detail' livro.pk %}">Cancelar</a>
    </form>
</div>
{% endblock %}
